name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill:
    name: craftengine-wiki skill
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .opencode/skills/craftengine-wiki
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .opencode/skills/craftengine-wiki/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
